name: cecebe
x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://cecebe:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/cecebe?schema=public
    REDIS_URL: redis://redis:6379
    APP_URL: ${APP_URL:-http://localhost:3000}
    AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    ALLOW_PRIVATE_AI: ${ALLOW_PRIVATE_AI:-false}
    TRUST_PROXY: ${TRUST_PROXY:-false}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
  volumes:
    - uploads:/app/public/uploads
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cecebe
      POSTGRES_DB: cecebe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cecebe -d cecebe"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    command: [./node_modules/.bin/prisma, migrate, deploy]
    depends_on:
      postgres:
        condition: service_healthy
  app:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *app
    command: [./node_modules/.bin/tsx, src/services/worker.ts]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  maintenance:
    <<: *app
    command:
      [
        sh,
        -c,
        "while true; do ./node_modules/.bin/tsx scripts/maintenance.ts; sleep 86400; done",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
